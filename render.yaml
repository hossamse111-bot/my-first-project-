services:
  - type: web
    name: mwaeedi-push
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SHEET_ID
        value: 1usNtOoYmfjHoj3EHtLVAKJi8_N_DmA7A-_AT-u3hfNA
      - key: GOOGLE_SHEET_TAB
        value: المواعيد
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
