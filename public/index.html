<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164b9d"><link rel="manifest" href="/manifest.webmanifest"><title>مواعيدي</title><style>body{font-family:system-ui,Tahoma;background:#f3f7fc;color:#18304d;margin:0}main{max-width:920px;margin:auto;padding:20px}h1{color:#164b9d}.panel{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 5px 20px #164b9d12}button{background:#164b9d;color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}input{padding:10px;border:1px solid #c8d4e5;border-radius:8px;max-width:100%}.item{padding:12px;border-bottom:1px solid #e6ecf5}.muted{color:#64748b;font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#list{min-height:90px}</style></head><body><main><h1>📅 مواعيدي</h1><p>مواعيد المدير والتذكيرات الذكية</p><section class="panel"><h2>إشعارات الآيفون</h2><p class="muted">ثبّت التطبيق من Safari على الشاشة الرئيسية ثم اضغط تفعيل الإشعارات.</p><div class="toolbar"><input id="device" placeholder="اسم الجهاز (المدير / جهازي)"><button id="subscribe">تفعيل الإشعارات</button></div><p id="pushstatus" class="muted"></p></section><section class="panel"><h2>المواعيد</h2><div id="list">جارٍ تحميل المواعيد...</div></section><section class="panel"><h2>إعدادات المسؤول</h2><p class="muted">حدد التذكير لكل موعد بالدقائق، مثل 300,60 قبل 5 ساعات وساعة.</p><input id="password" type="password" placeholder="كلمة مرور المسؤول"><button id="load">إدارة التذكيرات</button><div id="adminlist"></div></section></main><script>
let rows=[];const list=document.getElementById('list'),adminlist=document.getElementById('adminlist');
const field=(a,k)=>k.map(x=>a[x]).find(Boolean)||'';
async function load(){try{const r=await fetch('/api/appointments');if(!r.ok)throw Error();rows=await r.json();list.textContent='';rows.sort((a,b)=>String(field(a,['التاريخ'])).localeCompare(String(field(b,['التاريخ']))));for(const a of rows){const el=document.createElement('div');el.className='item';const strong=document.createElement('strong');strong.textContent=field(a,['عنوان الموعد'])||'موعد';const small=document.createElement('div');small.className='muted';small.textContent=[field(a,['اليوم']),field(a,['التاريخ']),field(a,['الوقت']),field(a,['المكان أو الرابط'])].filter(Boolean).join(' • ');el.append(strong,small);list.append(el)}if(!rows.length)list.textContent='لا توجد مواعيد'}catch{list.textContent='تعذر تحميل المواعيد. تأكد من إعداد ربط Google Sheets.'}}
load();
document.getElementById('subscribe').onclick=async()=>{const status=document.getElementById('pushstatus');try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('الجهاز أو المتصفح لا يدعم Web Push');const config=await(await fetch('/api/config')).json();if(!config.pushReady)throw Error('خدمة الإشعارات لم تُهيأ بعد');const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('لم يتم السماح بالإشعارات');const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;const key=config.vapidPublicKey;const b64=(key+'='.repeat((4-key.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');const arr=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:arr});const response=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription,label:document.getElementById('device').value||'جهاز'})});if(!response.ok)throw Error('تعذر تسجيل الجهاز');status.textContent='تم تسجيل الجهاز لاستقبال الإشعارات'}catch(e){status.textContent=e.message}};
document.getElementById('load').onclick=async()=>{const password=document.getElementById('password').value;const r=await fetch('/api/reminders',{headers:{'x-admin-password':password}});if(!r.ok){adminlist.textContent='كلمة المرور غير صحيحة أو إعداد المسؤول غير مكتمل';return}const reminders=await r.json();adminlist.textContent='';for(const a of rows){const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=field(a,['عنوان الموعد'])+' — '+field(a,['التاريخ']);const inp=document.createElement('input');inp.value=(reminders[a.id]||[]).join(',');inp.placeholder='300,60';const btn=document.createElement('button');btn.textContent='حفظ';btn.onclick=async()=>{const minutes=inp.value.split(',').map(s=>s.trim()).filter(Boolean).map(Number);const res=await fetch('/api/reminders/'+encodeURIComponent(a.id),{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({minutes})});btn.textContent=res.ok?'تم الحفظ':'خطأ في الحفظ'};div.append(name,document.createElement('br'),inp,btn);adminlist.append(div)}};
</script></body></html>
